[ids]
*

[main]
## Overload capslock to control on hold and esc on tap
capslock = overload(control, esc)
leftalt = layer(alt)
rightalt = layer(altgr)

[altgr]
w = up
a = left
s = down
d = right

[alt]
m = oneshot(media)

[shift]
## Rebind capslock on a shift-layer so shift + capslock
capslock = capslock

[media]
space = playpause
h = previoussong
j = volumedown
k = volumeup
l = nextsong
